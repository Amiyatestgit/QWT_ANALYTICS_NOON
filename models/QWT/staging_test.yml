version: 2

models:
  - name: stg_customers
    columns:
      - name: CUSTOMERID
        tests:
          - unique
          - not_null
  - name: stg_products
    columns:
      - name: productid
        tests:
          - unique
          - not_null
          - is_even
  - name: stg_shipments
    columns:
      - name: status
        tests:
          - accepted_values:
              values: ["shipped", "returned", "ordered", "replaced"]
  - name: stg_orderdetails
    columns:
      - name: orderid
        tests:
          - relationships:
              field: orderid
              to: ref('stg_orders')
